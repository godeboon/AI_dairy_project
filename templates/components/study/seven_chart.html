<div class="seven-chart-container">
  <!-- 왼쪽 상단: 그래프 컨테이너 -->
  <div class="chart-section top-left">
    <div class="chart-canvas-container">
      <canvas id="emotionTrendChart"></canvas>
    </div>
  </div>

  <!-- 오른쪽 상단: 점수 (레이더 차트) -->
  <div class="chart-section top-right">
    <div class="radar-chart-container">
      <canvas id="radarChart"></canvas>
    </div>
  </div>

  <!-- 왼쪽 하단: 텍스트 영역 -->
  <div class="emotion-trend-text" id="emotionTrendText">
    <div class="chart-loading">현재 수집된 데이터가 부족해 표시할 수 없습니다.</div>
    <div class="trend-analysis" style="display: none;">
      <div class="trend-section">
        <h4><strong>주요 경향</strong></h4>
        <p id="mainTrend"></p>
      </div>
      <div class="trend-section">
        <h4><strong>지배적 감정</strong></h4>
        <p id="dominantEmotion"></p>
      </div>
      <div class="trend-section">
        <h4><strong>추천사항</strong></h4>
        <p id="recommendations"></p>
      </div>
      <div class="trend-section">
        <h4><strong>주간 종합 평가</strong></h4>
        <p id="weeklyAssessment"></p>
      </div>
    </div>
  </div>

  <!-- 오른쪽 하단: 종합 평가 -->
  <div class="emotion-trend-text" id="comprehensiveAssessment">
    <div class="chart-loading">현재 수집된 데이터가 부족해 표시할 수 없습니다.</div>
    
    <!-- 키워드 및 인사이트 컨테이너 -->
    <div class="keyword-insights-container" style="display: none;">
      <!-- 메인 테마 키워드 섹션 -->
      <div class="main-themes-section">
        <h4><strong>이번주 주요 키워드</strong></h4>
        <div class="keyword-list" id="mainThemesList">
          <!-- 키워드들이 여기에 동적으로 추가됩니다 -->
        </div>
      </div>
      
      <!-- 인사이트 섹션 -->
      <div class="insights-section">
        <h4><strong>주요 인사이트</strong></h4>
        <div class="insights-container" id="insightsContainer">
          <!-- 인사이트들이 여기에 동적으로 추가됩니다 -->
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Chart.js 라이브러리 로드 -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<!-- 차트 팝업 CSS 로드 -->
<link rel="stylesheet" href="/static/css/components/popup/chart_popup.css">

<!-- CSS 로드 -->
<link rel="stylesheet" href="/static/css/components/study/seven_chart.css">
